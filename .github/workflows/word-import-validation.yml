name: Validate private vocabulary importer
on:
  workflow_dispatch:
  push:
    paths:
      - 'Vocabulary-import-validation.zip'
      - '.github/workflows/word-import-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Unpack synthetic-only validation source
        run: unzip -q Vocabulary-import-validation.zip
      - name: Test importer and compile iPhone app
        run: |
          set -o pipefail
          bash StudyDesk/scripts/build-ipa.sh 2>&1 | tee vocabulary-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vocabulary-import-validation-log
          path: vocabulary-validation.log
          retention-days: 7
